<ng-container [formGroup]="group">

  <div class="btn-group" role="group"
    [formGroupName]="model.id"
    [id]="id"
    [ngClass]="getClass('element', 'control')">

    @for (checkboxModel of model.group; track checkboxModel) {
      <input type="checkbox" class="btn-check"
        [formControlName]="checkboxModel.id"
        [hidden]="checkboxModel.hidden"
        [id]="getCheckboxId(checkboxModel)"
        [name]="checkboxModel.name"
        [required]="checkboxModel.required"
        [tabindex]="checkboxModel.tabIndex"
        (blur)="onBlur($event)"
        (change)="onCheckboxChange($event, checkboxModel)"
        (focus)="onFocus($event)"/>
      <label class="btn btn-outline-secondary"
        [attr.for]="getCheckboxId(checkboxModel)"
        [hidden]="checkboxModel.hidden"
        [innerHTML]="checkboxModel.label"
      [ngClass]="getClass('element', 'control', checkboxModel)"></label>
    }

  </div>

</ng-container>
