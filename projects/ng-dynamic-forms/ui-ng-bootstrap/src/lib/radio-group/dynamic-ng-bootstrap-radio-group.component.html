<ng-container [formGroup]="group">

  <div class="btn-group" role="radiogroup"
    [id]="id"
    [ngClass]="getClass('element', 'control')"
    (change)="onChange($event)">

    @if (model.legend) {
      <legend [innerHTML]="model.legend"></legend>
    }

    @for (option of model.options$ | async; track option; let idx = $index) {
      <input type="radio" class="btn-check"
        [attr.disabled]="option.disabled ? '' : null"
        [formControlName]="model.id"
        [id]="getRadioId(idx)"
        [name]="model.name"
        [tabindex]="model.tabIndex"
        [value]="option.value"
        (blur)="onBlur($event)"
        (focus)="onFocus($event)"/>
      <label class="btn btn-outline-secondary"
        [attr.for]="getRadioId(idx)"
        [innerHTML]="option.label"
      [ngClass]="[getClass('element', 'option'), getClass('grid', 'option')]"></label>
    }

  </div>

</ng-container>
