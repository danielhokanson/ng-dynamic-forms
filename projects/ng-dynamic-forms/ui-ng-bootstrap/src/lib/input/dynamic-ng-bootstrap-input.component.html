<div [formGroup]="group" [class.input-group]="model.prefix || model.suffix">

  @if (model.prefix) {
    <div class="input-group-prepend">
      <span class="input-group-text" [innerHTML]="model.prefix"></span>
    </div>
  }

  @if (model.inputType === 'file') {
    <input class="form-control-file"
      [attr.accept]="model.accept"
      [attr.max]="model.max"
      [attr.min]="model.min"
      [attr.multiple]="model.multiple"
      [attr.step]="model.step"
      [autocomplete]="model.autoComplete"
      [class.is-invalid]="showErrorMessages"
      [dynamicList]="$any(model.listId)"
      [formControlName]="model.id"
      [id]="id"
      [maxlength]="model.maxLength"
      [minlength]="model.minLength"
      [name]="model.name"
      [ngClass]="getClass('element', 'control')"
      [pattern]="$any(model.pattern)"
      [placeholder]="model.placeholder"
      [readonly]="model.readOnly"
      [required]="model.required"
      [spellcheck]="model.spellCheck"
      [tabindex]="model.tabIndex"
      [type]="model.inputType"
      (blur)="onBlur($event)"
      (change)="onChange($event)"
      (focus)="onFocus($event)"/>
  } @else {
    <input class="form-control"
      [attr.accept]="model.accept"
      [attr.max]="model.max"
      [attr.min]="model.min"
      [attr.multiple]="model.multiple"
      [attr.step]="model.step"
      [autocomplete]="model.autoComplete"
      [class.is-invalid]="showErrorMessages"
      [dynamicList]="$any(model.listId)"
      [formControlName]="model.id"
      [id]="id"
      [maxlength]="model.maxLength"
      [minlength]="model.minLength"
      [name]="model.name"
      [ngClass]="getClass('element', 'control')"
      [pattern]="$any(model.pattern)"
      [placeholder]="model.placeholder"
      [readonly]="model.readOnly"
      [required]="model.required"
      [spellcheck]="model.spellCheck"
      [tabindex]="model.tabIndex"
      [mask]="model.mask"
      [specialCharacters]="$safeNavigationMigration(model.maskConfig?.specialCharacters)"
      [patterns]="$safeNavigationMigration(model.maskConfig?.patterns)"
      [prefix]="$safeNavigationMigration(model.maskConfig?.prefix)"
      [suffix]="$safeNavigationMigration(model.maskConfig?.suffix)"
      [thousandSeparator]="$safeNavigationMigration(model.maskConfig?.thousandSeparator)"
      [decimalMarker]="$safeNavigationMigration(model.maskConfig?.decimalMarker)"
      [dropSpecialCharacters]="$safeNavigationMigration(model.maskConfig?.dropSpecialCharacters)"
      [hiddenInput]="$safeNavigationMigration(model.maskConfig?.hiddenInput)"
      [showMaskTyped]="$safeNavigationMigration(model.maskConfig?.showMaskTyped)"
      [placeHolderCharacter]="$safeNavigationMigration(model.maskConfig?.placeHolderCharacter)"
      [shownMaskExpression]="$safeNavigationMigration(model.maskConfig?.shownMaskExpression)"
      [clearIfNotMatch]="$safeNavigationMigration(model.maskConfig?.clearIfNotMatch)"
      [validation]="$safeNavigationMigration(model.maskConfig?.validation)"
      [separatorLimit]="$safeNavigationMigration(model.maskConfig?.separatorLimit)"
      [allowNegativeNumbers]="$safeNavigationMigration(model.maskConfig?.allowNegativeNumbers)"
      [leadZeroDateTime]="$safeNavigationMigration(model.maskConfig?.leadZeroDateTime)"
      [type]="model.inputType"
      (blur)="onBlur($event)"
      (change)="onChange($event)"
      (focus)="onFocus($event)"/>
  }


  @if (model.suffix) {
    <div class="input-group-append">
      <span class="input-group-text" [innerHTML]="model.suffix"></span>
    </div>
  }

  @if (model.hasList) {
    <datalist [id]="model.listId">
      @for (option of model.list$ | async; track option) {
        <option [value]="option">
        }
      </datalist>
    }

  </div>
