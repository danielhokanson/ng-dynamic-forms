<div [formGroup]="group" [ngClass]="getClass('grid', 'control')">

    <p-colorpicker #pColorPicker
                   [format]="format"
                   [formControlName]="model.id"
                   [id]="id"
                   [inline]="model.inline"
                   [ngClass]="getClass('element','control')"
                   [tabindex]="model.tabIndex?.toString()"
                   (onChange)="onChange($event)"></p-colorpicker>

</div>
