<ng-container [formGroup]="group">

  <fieldset [formGroupName]="model.id"
    [id]="id"
    [name]="model.name"
    [ngClass]="getClass('element', 'control')">

    @if (model.legend) {
      <legend [innerHTML]="model.legend"></legend>
    }

    @for (_model of model.group; track _model) {
      <dynamic-bootstrap-form-control
        [asBootstrapFormGroup]="false"
        [group]="$any(control)"
        [hidden]="_model.hidden"
        [layout]="formLayout"
        [model]="_model"
        [templates]="$any(templates)"
        [hostClass]="[getClass('element','children'), getClass('grid','children')]"
        (blur)="onBlur($event)"
        (change)="onChange($event)"
        (focus)="onFocus($event)"
      (bsEvent)="onCustomEvent($event, null, true)"></dynamic-bootstrap-form-control>
    }
  </fieldset>

</ng-container>
