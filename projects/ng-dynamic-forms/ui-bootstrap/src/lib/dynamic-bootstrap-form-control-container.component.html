<div [class.form-group]="asBootstrapFormGroup || getClass('element', 'container').includes('form-group')"
  [class.has-error]="showErrorMessages"
  [formGroup]="group"
  [ngClass]="['ng-dynamic-forms-'+model.type.toLowerCase(), getClass('element', 'container'), getClass('grid', 'container')]">

  @if (!isCheckbox && hasLabel) {
    <label
      [for]="id"
      [innerHTML]="model.label"
    [ngClass]="[getClass('element', 'label'), getClass('grid', 'label')]"></label>
  }

  <ng-container *ngTemplateOutlet="$safeNavigationMigration(startTemplate?.templateRef); context: model"></ng-container>

  <div [ngClass]="getClass('grid', 'control')">

    <ng-container #componentViewContainer></ng-container>

    @if (hasHint) {
      <span class="help-block" [innerHTML]="hint"
      [ngClass]="getClass('element', 'hint')"></span>
    }

  </div>

  @if (showErrorMessages) {
    <ul class="has-error"
      [ngClass]="[getClass('element', 'errors'), getClass('grid', 'errors')]">
      @for (message of errorMessages; track message) {
        <li class="help-block">{{ message }}</li>
      }
    </ul>
  }

  <ng-container *ngTemplateOutlet="$safeNavigationMigration(endTemplate?.templateRef); context: model"></ng-container>

  <ng-content></ng-content>

</div>
