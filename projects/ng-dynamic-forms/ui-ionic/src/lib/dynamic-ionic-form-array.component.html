<ng-container [formGroup]="group">

  <div [formArrayName]="model.id" [id]="id" [ngClass]="getClass('element', 'control')">

    @for (groupModel of model.groups; track groupModel; let idx = $index) {
      <div role="group"
        [formGroupName]="idx" [ngClass]="[getClass('element', 'group'), getClass('grid', 'group')]">
        <ng-container *ngTemplateOutlet="startTemplate?.templateRef ?? null; context: groupModel"></ng-container>
        @for (_model of groupModel.group; track _model) {
          <dynamic-ionic-form-control
            [context]="groupModel"
            [group]="getGroup(idx)"
            [hidden]="_model.hidden"
            [layout]="formLayout"
            [model]="_model"
            [templates]="templates"
            [hostClass]="[getClass('element','children'), getClass('grid','children')]"
            (blur)="onBlur($event)"
            (change)="onChange($event)"
            (focus)="onFocus($event)"
          (ionEvent)="onCustomEvent($event, null, true)"></dynamic-ionic-form-control>
        }
        <ng-container *ngTemplateOutlet="endTemplate?.templateRef ?? null; context: groupModel"></ng-container>
      </div>
    }

  </div>

</ng-container>
