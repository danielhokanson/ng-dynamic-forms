<div [formGroup]="group" [ngClass]="['ng-dynamic-forms-'+model.type.toLowerCase(), getClass('element', 'container'), getClass('grid', 'container')]">

  @if (!isCheckbox && hasLabel) {
    <label
      [for]="id"
      [innerHTML]="model.label"
    [ngClass]="[getClass('element', 'label'), getClass('grid', 'label')]"></label>
  }

  <ng-container *ngTemplateOutlet="$safeNavigationMigration(startTemplate?.templateRef); context: model"></ng-container>

  <ng-container #componentViewContainer></ng-container>

  @if (hasHint) {
    <div [ngClass]="[getClass('element', 'hint'), getClass('grid', 'hint')]">
      <span [innerHTML]="hint"></span>
    </div>
  }

  @if (showErrorMessages) {
    <ul [ngClass]="[getClass('element', 'errors'), getClass('grid', 'errors')]">
      @for (message of errorMessages; track message) {
        <li>{{ message }}</li>
      }
    </ul>
  }

  <ng-container *ngTemplateOutlet="$safeNavigationMigration(endTemplate?.templateRef); context: model"></ng-container>

  <ng-content></ng-content>

</div>
