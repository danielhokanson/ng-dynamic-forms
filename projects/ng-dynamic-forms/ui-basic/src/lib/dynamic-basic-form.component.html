@for (controlModel of model; track trackByFn($index, controlModel)) {
  <dynamic-basic-form-control
    [group]="group"
    [hidden]="controlModel.hidden"
    [layout]="layout"
    [model]="controlModel"
    [templates]="templates"
    (blur)="onBlur($event)"
    (change)="onChange($event)"
    (focus)="onFocus($event)"
  (customEvent)="onCustomEvent($event, customEvent)"></dynamic-basic-form-control>
}
