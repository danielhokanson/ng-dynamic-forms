<div [formGroup]="group" class="input-group">

  <input bsDatepicker class="form-control" #bsDatepicker="bsDatepicker"

    [bsConfig]="model.getAdditional('bsConfig', {containerClass: model.getAdditional('containerClass', 'theme-green'), showWeekNumbers: model.getAdditional('showWeekNumbers', true)})"
    [datesDisabled]="model.getAdditional('datesDisabled', [])"
    [daysDisabled]="model.getAdditional('daysDisabled', [])"
    [formControlName]="model.id"
    [id]="id"
    [maxDate]="$any(model.max)"
    [minDate]="$any(model.min)"
    [name]="model.name"
    [ngClass]="getClass('element', 'control')"
    [outsideClick]="model.getAdditional('outsideClick', true)"
    [outsideEsc]="model.getAdditional('outsideEsc', true)"
    [placeholder]="model.placeholder"
    [placement]="model.getAdditional('placement', 'bottom')"
    [readonly]="model.readOnly"
    [required]="model.required"
    (bsValueChange)="onChange($event)"
    (onHidden)="onCustomEvent($event, 'onHidden')"
    (onShown)="onCustomEvent($event, 'onShown')">

  @if (model.toggleIcon || model.toggleLabel) {
    <div class="input-group-append">
      @if (model.toggleIcon) {
        <button
          class="btn input-group-text" type="button"
        (click)="bsDatepicker.toggle()"><img [src]="model.toggleIcon" alt="Toggle datepicker"/></button>
      }
      @if (model.toggleLabel) {
        <button
          class="btn input-group-text" type="button"
        (click)="bsDatepicker.toggle()">{{ model.toggleLabel }}</button>
      }
    </div>
  }

</div>
