<div [formGroup]="group"
  [ngClass]="['ng-dynamic-forms-'+model.type.toLowerCase(), getClass('element', 'container'), getClass('grid', 'container')]">

  @if (!hasMatFormField && !isCheckbox && hasLabel) {
    <label
      [for]="id"
      [innerHTML]="model.label"
    [ngClass]="[getClass('element', 'label'), getClass('grid', 'label')]"></label>
  }

  <ng-container *ngTemplateOutlet="startTemplate?.templateRef ?? null; context: model"></ng-container>

  <ng-container #componentViewContainer></ng-container>

  @if (!hasMatFormField) {
    @for (message of errorMessages; track message) {
      <mat-error>{{ message }}</mat-error>
    }
  }

  <ng-container *ngTemplateOutlet="endTemplate?.templateRef ?? null; context: model"></ng-container>

  <ng-content></ng-content>

</div>
