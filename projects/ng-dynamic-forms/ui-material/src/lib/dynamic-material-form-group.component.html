<ng-container [formGroup]="group">

  <div role="group"
    [formGroupName]="model.id"
    [id]="id"
    [ngClass]="[getClass('element', 'control'), getClass('grid', 'control')]">

    @for (_model of model.group; track _model) {
      <dynamic-material-form-control
        [group]="controlGroup"
        [hidden]="_model.hidden"
        [layout]="formLayout"
        [model]="_model"
        [templates]="templateList"
        [hostClass]="[getClass('element','children'), getClass('grid','children')]"
        (blur)="onBlur($event)"
        (change)="onChange($event)"
        (focus)="onFocus($event)"
      (matEvent)="onCustomEvent($event, null, true)"></dynamic-material-form-control>
    }
  </div>

</ng-container>
